name: Keep Render server awake

on:
  schedule:
    # 10분마다 실행 (Render 무료 플랜은 15분 무접속 시 슬립되므로 여유 있게 설정)
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server health endpoint
        run: |
          curl -fsS --max-time 20 https://tetris-ym3c.onrender.com/health || \
          curl -fsS --max-time 20 https://tetris-ym3c.onrender.com/ || \
          echo "핑 실패 (서버가 콜드스타트 중일 수 있음, 다음 주기에 재시도)"
